syntax = "proto3";
package spire.api.types;
option go_package = "github.com/spiffe/spire-api-sdk/proto/spire/api/types";

// Hardware-rooted attestation for sovereign workload identity
// A hardware-rooted proof-of-residency package produced by the Agent.
message SovereignAttestation {
    // Base64-encoded TPM Quote (portable string). Validation: non-empty, base64, size <= 64kB
    optional string tpm_signed_attestation = 1;

    // The App Key public key (PEM or base64-encoded). Preferred format: PEM.
    // Validation: when present must parse; server-side validation enforced.
    optional string app_key_public = 2;

    // Optional base64-encoded DER or PEM certificate proving the App Key was issued/signed by the host AK.
    // **CLARIFICATION:** This field MUST be Base64-encoded when transmitted over a JSON/REST boundary (e.g., to Keylime).
    // Validation: when present must parse to X.509 cert; chain verification will be performed by Keylime.
    optional bytes app_key_certificate = 3;

    // The SPIRE Server nonce used for freshness verification.
    optional string challenge_nonce = 4;

    // Optional workload code hash used as an additional selector/assertion.
    optional string workload_code_hash = 5;

    // Unified-Identity - Phase 3: rust-keylime agent UUID for delegated certification correlation.
    optional string keylime_agent_uuid = 6;
}

// Hardware-attested claims for workload identity enrichment
// AttestedClaims contains verified facts from hardware attestation service about the host.
message HardwareAttestedClaims {
    optional Geolocation geolocation = 1;    // Geolocation object with type, sensor_id, and optional value
    optional MNOEndorsement mno_endorsement = 2; // Gen 4: Signed MNO endorsement
    optional string sovereignty_receipt = 3;     // Gen 4: ZKP proof of proximity
}

// Gen 4: MNOEndorsement represents a signed endorsement from a carrier
message MNOEndorsement {
    optional bool verified = 1;
    optional string endorsement_json = 2; // JSON-encoded endorsement data
    optional string signature = 3;        // EdDSA signature
    optional string key_id = 4;           // Signing key ID
}

// Unified-Identity - Phase 1: SPIRE API & Policy Staging (Stubbed Keylime)
// Geolocation represents geolocation sensor metadata
message Geolocation {
    optional string type = 1;        // "mobile" or "gnss"
    optional string sensor_id = 2;   // Sensor identifier (e.g., USB ID "12d1:1433" for mobile)
    optional string value = 3;       // Optional for mobile, mandatory for gnss (e.g., GNSS coordinates)
    optional string sensor_imei = 4; // IMEI for mobile devices
    optional string sensor_imsi = 5; // IMSI for mobile devices
    optional string sensor_msisdn = 6; // MSISDN for mobile devices

    // GNSS-specific fields
    optional string sensor_serial_number = 7;
    optional double latitude = 8;
    optional double longitude = 9;
    optional double accuracy = 10;
    string sensor_signature = 11;
}

